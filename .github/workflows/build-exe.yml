name: Build Windows setup app

# Produce a download-and-run .exe (no Python needed on the user's PC).
# Tag a release to publish:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Build the app
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --noupx
          --name TikTokStreakSetup
          --icon assets/app_icon.ico
          --add-data "assets;assets"
          --add-data "src;src"
          --add-data "main.py;."
          --add-data "requirements.txt;."
          --add-data "test_runner.py;."
          --add-data ".github/workflows/streak.yml;.github/workflows"
          --collect-all qfluentwidgets
          --collect-all qframelesswindow
          --collect-all keyring
          --collect-all nacl
          --collect-all selenium
          --hidden-import win32crypt
          --hidden-import win32cred
          --hidden-import pywintypes
          --hidden-import Crypto.Cipher.AES
          --hidden-import PIL
          --hidden-import dotenv
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtQuick
          run_gui.py

      - name: Smoke test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & "dist/TikTokStreakSetup.exe" --smoke-test | Out-Default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from PyInstaller.archive.readers import CArchiveReader, ZlibArchiveReader; r = CArchiveReader('dist/TikTokStreakSetup.exe'); toc_top = list(r.toc.keys()) if hasattr(r.toc, 'keys') else list(r.toc); assert any('selenium-manager.exe' in str(m).lower() for m in toc_top), f'selenium-manager.exe missing from {len(toc_top)} entries'; pyz = r.open_embedded_archive('PYZ.pyz'); assert isinstance(pyz, ZlibArchiveReader); toc = set(pyz.toc); missing = [m for m in ('selenium.webdriver.chrome.webdriver', 'selenium.webdriver.edge.webdriver') if m not in toc]; assert not missing, f'Missing selenium modules: {missing}'; print('Frozen single-file selenium check passed.')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokStreakSetup-windows
          path: dist/TikTokStreakSetup.exe

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TikTokStreakSetup.exe
