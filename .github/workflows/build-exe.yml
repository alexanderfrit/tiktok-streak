name: Build Windows setup app

# Produce a download-and-run .exe (no Python needed on the user's PC).
# Tag a release to publish:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_nuitka:
        description: 'Also build experimental Nuitka cached-onefile artifact for size/startup comparison'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build PyInstaller (Pruned Spec)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Sync APP_VERSION on tag builds
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content -Raw -Encoding UTF8 "gui/version.py"
          $updated = [regex]::Replace($content, 'APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$tagVer`"")
          Set-Content -Path "gui/version.py" -Value $updated -Encoding UTF8 -NoNewline
          python -c "from gui.version import APP_VERSION; assert APP_VERSION == '$tagVer', APP_VERSION; print('Synced APP_VERSION =', APP_VERSION)"

      - name: Build the app (surgical .spec)
        run: pyinstaller --noconfirm --clean TikTokStreakSetup.spec

      - name: Smoke test & verify pruned frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $exe = Get-Item "dist/TikTokStreakSetup.exe"
          $sizeMb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built TikTokStreakSetup.exe: $sizeMb MB"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & "dist/TikTokStreakSetup.exe" --smoke-test | Out-Default
          $sw.Stop()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Frozen --smoke-test latency: $($sw.ElapsedMilliseconds) ms"
          python -c "from PyInstaller.archive.readers import CArchiveReader, ZlibArchiveReader; r = CArchiveReader('dist/TikTokStreakSetup.exe'); toc_top = [str(m).replace(chr(92), '/').lower() for m in (r.toc.keys() if hasattr(r.toc, 'keys') else r.toc)]; assert any(m.endswith('selenium/webdriver/common/windows/selenium-manager.exe') for m in toc_top), f'selenium-manager.exe missing from {len(toc_top)} entries'; bad_sel = [m for m in toc_top if 'selenium-manager' in m and ('/macos/' in m or '/linux/' in m)]; assert not bad_sel, f'Non-Windows selenium-manager still bundled: {bad_sel}'; assert not any(m.endswith('opengl32sw.dll') for m in toc_top), 'opengl32sw.dll should be pruned'; pyz = r.open_embedded_archive('PYZ.pyz'); assert isinstance(pyz, ZlibArchiveReader); toc = set(pyz.toc); missing = [m for m in ('selenium.webdriver.chrome.webdriver', 'selenium.webdriver.edge.webdriver', 'gui.pages.automation_page', 'gui.services.cloud_deploy') if m not in toc]; assert not missing, f'Missing modules: {missing}'; print('Frozen single-file pruned archive check passed.')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokStreakSetup-windows
          path: dist/TikTokStreakSetup.exe

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Tiktok Streak Setup
          files: dist/TikTokStreakSetup.exe

  build-nuitka:
    name: Build Nuitka (Cached Onefile Comparison)
    if: github.event_name == 'workflow_dispatch' && inputs.build_nuitka
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies + Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt nuitka ordered-set zstandard

      - name: Build & benchmark Nuitka cached-onefile executable
        run: python scripts/build_nuitka.py --output-dir dist-nuitka --exe-name TikTokStreakSetup-nuitka.exe

      - name: Upload Nuitka comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokStreakSetup-windows-nuitka
          path: dist-nuitka/TikTokStreakSetup-nuitka.exe
