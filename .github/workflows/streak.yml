name: TikTok Daily Streak

on:
  schedule:
    # Schedule uses UTC time (UTC = WIB - 7 hours)
    # Examples:
    #   Once a day at 08:00 WIB (01:00 UTC):
    #     - cron: '0 1 * * *'
    #   Twice a day at 08:00 and 20:00 WIB (01:00 and 13:00 UTC):
    #     - cron: '0 1,13 * * *'
    #   Three times a day at 08:00, 14:00, and 20:00 WIB (01:00, 07:00, 13:00 UTC):
    #     - cron: '0 1,7,13 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Google Chrome
        run: google-chrome --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TikTok Streak Auto Send
        env:
          TIKTOK_ACCOUNTS_JSON: ${{ secrets.TIKTOK_ACCOUNTS_JSON }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          MESSAGE: ${{ secrets.MESSAGE }}
          FRIENDS_LIST: ${{ secrets.FRIENDS_LIST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
        run: |
          python main.py

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-diagnostics
          path: |
            debug_*.png
            debug_*.html
          retention-days: 7
