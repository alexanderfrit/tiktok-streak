<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>TikTok Streak — Setup</title>
<style>
  :root { --bg:#121212; --panel:#1b1b1e; --line:#2c2c31; --fg:#eaeaea; --muted:#9a9aa2;
          --accent:#fe2c55; --ok:#3fb950; --bad:#f85149; --btn:#2a2a2f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI",Roboto,system-ui,sans-serif; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .steps { display:flex; gap:6px; padding:10px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .chip { padding:4px 10px; border-radius:20px; background:var(--btn); color:var(--muted); font-size:12px; }
  .chip.active { background:var(--accent); color:#fff; }
  .chip.done { background:#1f3d24; color:var(--ok); }
  main { padding:22px; max-width:720px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; }
  h2 { font-size:17px; margin:0 0 6px; }
  p.hint { color:var(--muted); margin:0 0 16px; }
  label { display:block; margin:12px 0 4px; font-size:13px; color:var(--muted); }
  input[type=text], input[type=password], textarea, select {
    width:100%; padding:9px 11px; background:#0e0e10; color:var(--fg);
    border:1px solid var(--line); border-radius:7px; font:13px monospace; }
  textarea { min-height:74px; resize:vertical; }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row > div { flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:7px;
           padding:10px 16px; font-size:14px; cursor:pointer; }
  button.big { font-size:15px; padding:12px 20px; }
  button.ghost { background:var(--btn); color:var(--fg); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .btns { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
  .msg { margin-top:14px; padding:10px 12px; border-radius:7px; font-size:13px; display:none; }
  .msg.ok { display:block; background:#12261a; color:var(--ok); border:1px solid #1f3d24; }
  .msg.err { display:block; background:#2a1416; color:var(--bad); border:1px solid #3d1f22; }
  .msg.info { display:block; background:#141826; color:#8ab4f8; border:1px solid #1f2436; }
  .log { font:12px monospace; background:#0e0e10; border:1px solid var(--line);
         border-radius:7px; padding:10px; white-space:pre-wrap; max-height:200px; overflow:auto; display:none; }
  .code { font:34px/1.2 monospace; letter-spacing:6px; background:#0e0e10; border:1px dashed var(--line);
          border-radius:9px; padding:14px; text-align:center; margin:14px 0; color:#fff; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--muted);
             border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .privacy { margin-top:18px; font-size:12px; color:var(--muted); }
  details { margin-top:16px; } summary { cursor:pointer; color:var(--muted); font-size:13px; }
  a { color:#8ab4f8; } small code { background:#0e0e10; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="connDot"></span>
  <h1>TikTok Streak — Setup</h1>
</header>
<div class="steps" id="steps"></div>
<main>
  <div class="panel" id="panel"></div>
</main>

<script>
const api = () => window.pywebview && window.pywebview.api;
let ST = {
  step: 0,
  token: "",
  login: "",
  sourceRepo: "alexanderfrit/tiktok-streak",
  repoName: "tiktok-streak",
  owner: "",
  sessionid: "",
  cookieText: "",
  username: "",
  message: "🔥 Daily Streak",
  friends: "",
  videoUrl: "",
  shareTimes: 2,
  photoPath: "",
  tgToken: "",
  tgChatId: "",
};

const STEPS = ["Masuk GitHub", "Akun TikTok", "Notifikasi", "Aktifkan"];
const panel = document.getElementById("panel");
const stepsEl = document.getElementById("steps");
const connDot = document.getElementById("connDot");

function renderSteps() {
  stepsEl.innerHTML = STEPS.map((s, i) =>
    `<span class="chip ${i === ST.step ? "active" : (i < ST.step ? "done" : "")}">${i+1}. ${s}</span>`
  ).join("");
}
function setMsg(html, kind) {
  let el = panel.querySelector(".msg");
  if (!el) { el = document.createElement("div"); el.className = "msg"; panel.appendChild(el); }
  el.className = "msg " + kind; el.innerHTML = html;
}
function showLog(text) {
  let el = panel.querySelector(".log");
  if (!el) { el = document.createElement("div"); el.className = "log"; panel.appendChild(el); }
  el.style.display = "block"; el.textContent = text;
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function openExt(url){ const a=document.createElement("a"); a.href=url; a.target="_blank"; a.click(); }

/* ---------- STEP 0: GitHub ---------- */
function stepGithub() {
  panel.innerHTML = `
    <h2>Masuk dengan GitHub</h2>
    <p class="hint">Aplikasi ini menyimpan bot kamu di akun GitHub milikmu sendiri, tanpa biaya.
      Satu klik untuk masuk — tak perlu bikin apa pun.</p>
    <div id="ghbody"></div>
    <details>
      <summary>Cara lain (lanjutan)</summary>
      <p class="hint" style="margin-top:8px">Tempel token GitHub secara manual.</p>
      <input type="password" id="tok" placeholder="ghp_... / github_pat_..." value="${esc(ST.token)}" />
      <div class="btns"><button class="ghost" id="connectTok">Pakai token ini</button></div>
    </details>
    <div class="msg"></div>
    <p class="privacy">🔒 Data kamu hanya dikirim ke GitHub milikmu. Tak ke mana pun.</p>`;
  document.getElementById("connectTok").onclick = async () => {
    const tok = document.getElementById("tok").value.trim();
    if (!tok) return setMsg("Tempel dulu tokennya.", "err");
    setMsg("Memeriksa…", "info");
    const r = await api().save_token(tok);
    if (!r.ok) return setMsg("❌ " + esc(r.error), "err");
    ST.token = tok; ST.login = r.login; ST.owner = r.login;
    connDot.style.background = "var(--ok)";
    setMsg("✅ Sudah masuk sebagai <b>" + esc(r.login) + "</b>.", "ok");
    setTimeout(() => { ST.step = 1; render(); }, 700);
  };
  renderGithubEntry();
}

function renderGithubEntry() {
  const box = document.getElementById("ghbody");
  if (ST.token && ST.login) {
    connDot.style.background = "var(--ok)";
    box.innerHTML = `<div class="msg ok" style="display:block">✅ Sudah masuk sebagai <b>${esc(ST.login)}</b>.</div>
      <div class="btns"><button class="big" id="next">Lanjut →</button></div>`;
    document.getElementById("next").onclick = () => { ST.step = 1; render(); };
    return;
  }
  box.innerHTML = `<button class="big" id="signin">🔐 Masuk dengan GitHub</button>`;
  document.getElementById("signin").onclick = async () => {
    box.innerHTML = `<p class="hint"><span class="spinner"></span> Menyiapkan kode…</p>`;
    const r = await api().github_login_start();
    if (!r.ok) {
      box.innerHTML = `<div class="msg err" style="display:block">❌ ${esc(r.error)}<br>
        Coba "Cara lain (lanjutan)" di bawah untuk tempel token.</div>
        <button class="big" id="signin">🔐 Coba lagi</button>`;
      document.getElementById("signin").onclick = arguments.callee;
      return;
    }
    box.innerHTML = `
      <p class="hint">Kode di bawah sudah diisi otomatis di tab GitHub yang terbuka. Kalau tidak,
        <a href="#" id="ghlink">buka halaman ini</a> dan ketik kodenya.</p>
      <div class="code" id="ucode">${esc(r.user_code)}</div>
      <div class="btns">
        <button class="ghost" id="copy">Salin kode</button>
        <button class="ghost" id="reopen">Buka GitHub</button>
      </div>
      <p class="hint" id="pollhint" style="margin-top:14px"><span class="spinner"></span> Menunggu kamu klik Authorize…</p>`;
    api().open_url(r.verification_uri);
    document.getElementById("ghlink").onclick = (e)=>{ e.preventDefault(); api().open_url(r.verification_uri); };
    document.getElementById("reopen").onclick = () => api().open_url(r.verification_uri);
    document.getElementById("copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(r.user_code);
    const pr = await api().github_login_poll(r.device_code, r.interval || 5);
    if (!pr.ok) {
      document.getElementById("pollhint").innerHTML = `❌ ${esc(pr.error)} — coba lagi.`;
      return;
    }
    ST.token = pr.token; ST.login = pr.login; ST.owner = pr.login;
    connDot.style.background = "var(--ok)";
    renderGithubEntry();
  };
}

/* ---------- STEP 1: TikTok ---------- */
async function stepTikTok() {
  panel.innerHTML = `
    <h2>Hubungkan akun TikTok</h2>
    <p class="hint">Login dulu ke TikTok di browser biasa kamu, lalu aplikasi ini membaca sesinya
      otomatis. Pastikan browser yang dipakai sedang <b>tertutup</b>.</p>
    <div class="row">
      <div><label>Browser</label><select id="src"></select></div>
      <button class="ghost" id="reload">Pindai ulang</button>
      <button id="grab">Baca dari browser</button>
    </div>
    <details>
      <summary>Cara lain (lanjutan): tempel cookie manual</summary>
      <textarea id="paste" placeholder="sessionid=...; atau nilai sessionid saja"></textarea>
      <div class="btns"><button class="ghost" id="usepaste">Pakai nilai ini</button></div>
    </details>
    <div class="msg"></div>`;
  await fillSources();
  document.getElementById("reload").onclick = fillSources;
  document.getElementById("grab").onclick = async () => {
    const id = document.getElementById("src").value;
    if (!id) return setMsg("Tak ada browser terdeteksi. Pakai cara tempel manual di bawah.", "err");
    setMsg("Membaca… (tutup browser kalau error)", "info");
    const r = await api().read_cookies(id);
    if (!r.ok) return setMsg("❌ " + esc(r.error), "err");
    ST.sessionid = r.sessionid; ST.cookieText = r.cookie_text;
    if (!r.sessionid) return setMsg("⚠️ Belum ketemu. Sudah login TikTok di browser itu?", "err");
    await verifySession();
  };
  document.getElementById("usepaste").onclick = async () => {
    const raw = document.getElementById("paste").value.trim();
    if (!raw) return setMsg("Tempel dulu.", "err");
    const r = await api().parse_cookie(raw);
    if (!r.ok) return setMsg("❌ " + esc(r.error), "err");
    ST.sessionid = r.sessionid; ST.cookieText = r.cookie_text || raw;
    if (!r.sessionid) return setMsg("⚠️ Tak ada sessionid di teks itu.", "err");
    await verifySession();
  };
  addNav(2);
}
async function verifySession() {
  setMsg("<span class='spinner'></span> Memeriksa akun TikTok…", "info");
  const v = await api().check_session(ST.sessionid);
  if (!v.ok) {
    ST.username = "";
    return setMsg("❌ Sesi tidak valid atau kedaluwarsa. Login ulang TikTok di browser, lalu baca lagi.<br><small>" + esc(v.error) + "</small>", "err");
  }
  ST.username = v.username;
  setMsg("✅ Terhubung sebagai <b>@" + esc(v.username) + "</b>.", "ok");
}
async function fillSources() {
  const sel = document.getElementById("src");
  sel.innerHTML = "<option>memuat…</option>";
  const r = await api().list_browsers();
  if (!r.ok) { sel.innerHTML = "<option>error</option>"; return setMsg("❌ " + esc(r.error), "err"); }
  if (!r.sources.length) { sel.innerHTML = "<option value=''>(tak ada browser didukung)</option>"; return; }
  sel.innerHTML = r.sources.map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("");
}

/* ---------- STEP 2: Telegram ---------- */
function stepTelegram() {
  panel.innerHTML = `
    <h2>Notifikasi Telegram <span class="hint">(opsional)</span></h2>
    <p class="hint">Dapat kabar tiap hari saat streak terkirim. 1) Klik <a href="#" id="bf">buat bot</a>
      di Telegram dan kirim <code>/newbot</code>. 2) Tempel token di bawah, lalu tekan Start di bot kamu
      dan klik Kirim pesan uji.</p>
    <label>Token bot</label>
    <input type="password" id="tgtok" value="${esc(ST.tgToken)}" placeholder="123456789:ABC..." />
    <div class="btns">
      <button id="openBF">Buka BotFather</button>
      <button class="ghost" id="test">Kirim pesan uji</button>
      <button class="ghost" id="skip">Lewati</button>
    </div>
    <div class="msg"></div>`;
  document.getElementById("openBF").onclick = () => api().open_url("https://t.me/BotFather");
  document.getElementById("bf").onclick = (e) => { e.preventDefault(); api().open_url("https://t.me/BotFather"); };
  document.getElementById("test").onclick = async () => {
    const tok = document.getElementById("tgtok").value.trim();
    ST.tgToken = tok;
    if (!tok) return setMsg("Tempel token bot dulu.", "err");
    setMsg("<span class='spinner'></span> Mencari chat kamu… (tekan Start di bot dulu)", "info");
    const r = await api().telegram_find_chat_id(tok);
    if (!r.ok) return setMsg("❌ " + esc(r.error), "err");
    const t = await api().telegram_test(tok, r.chat_id);
    if (!t.ok) return setMsg("❌ " + esc(t.error), "err");
    ST.tgChatId = r.chat_id;
    setMsg("✅ Terkirim! Cek Telegram kamu — bot siap dipakai.", "ok");
  };
  document.getElementById("skip").onclick = () => { ST.step = 3; render(); };
  addNav(3, async () => {
    ST.tgToken = document.getElementById("tgtok").value.trim();
    if (ST.tgToken && !ST.tgChatId) {
      const r = await api().telegram_find_chat_id(ST.tgToken);
      if (r.ok) ST.tgChatId = r.chat_id;
    }
  });
}

/* ---------- STEP 3: Aktifkan ---------- */
function stepRun() {
  panel.innerHTML = `
    <h2>Aktifkan &amp; jalankan</h2>
    <p class="hint">Aplikasi akan membuat salinan bot di akun GitHub kamu dan menyalakannya.
      Bot jalan otomatis tiap hari, gratis.</p>
    <label>Pesan streak</label><input type="text" id="message" value="${esc(ST.message)}" />
    <label>Teman tujuan (pisahkan dengan koma)</label><input type="text" id="friends" value="${esc(ST.friends)}" placeholder="alice, bob" />
    <div class="btns"><button class="big" id="go">🚀 Aktifkan &amp; jalankan</button></div>
    <details>
      <summary>Pengaturan lanjutan</summary>
      <label>Nama repo GitHub</label><input type="text" id="name" value="${esc(ST.repoName || 'tiktok-streak')}" />
      <label>URL video (opsional)</label><input type="text" id="video" value="${esc(ST.videoUrl)}" />
      <label>Berapa kali kirim video</label><input type="text" id="shares" value="${esc(ST.shareTimes)}" />
    </details>
    <div class="log"></div>
    <div class="msg"></div>`;
  document.getElementById("go").onclick = async () => {
    ST.message = document.getElementById("message").value;
    ST.friends = document.getElementById("friends").value.trim();
    const nameEl = document.getElementById("name"); if (nameEl) ST.repoName = nameEl.value.trim();
    const vidEl = document.getElementById("video"); if (vidEl) ST.videoUrl = vidEl.value.trim();
    const shEl = document.getElementById("shares"); if (shEl) ST.shareTimes = parseInt(shEl.value.trim() || "2", 10);

    if (!ST.username) return setMsg("Hubungkan akun TikTok dulu (langkah 2).", "err");
    if (!ST.friends) return setMsg("Isi minimal satu teman tujuan.", "err");

    const secrets = {
      TIKTOK_SESSION_ID: ST.sessionid,
      MESSAGE: ST.message,
      FRIENDS_LIST: ST.friends,
    };
    if (ST.cookieText) secrets.TIKTOK_COOKIES = ST.cookieText;
    if (ST.videoUrl) { secrets.STREAK_VIDEO_URL = ST.videoUrl; secrets.SHARE_TIMES = String(ST.shareTimes); }
    if (ST.tgToken) secrets.TELEGRAM_BOT_TOKEN = ST.tgToken;
    if (ST.tgChatId) secrets.TELEGRAM_CHAT_ID = ST.tgChatId;

    setMsg("<span class='spinner'></span> Menyiapkan… (±30 detik)", "info");
    showLog("Mulai…");
    const r = await api().provision({
      token: ST.token, source_repo: ST.sourceRepo, owner: ST.owner,
      repo_name: ST.repoName || "tiktok-streak", secrets, dispatch: true,
    });
    showLog((r.steps || []).join("\n"));
    if (!r.ok) return setMsg("❌ Gagal: " + esc(r.error) + "<br><small>Coba lagi, atau buka Actions untuk detail.</small>", "err");
    renderDone(r);
  };
  addNav(-1);
}

function renderDone(r) {
  panel.innerHTML = `
    <h2>Selesai 🎉</h2>
    <p class="hint">Bot kamu aktif dan jalan otomatis tiap hari (±08:00 WIB). Kamu bisa menutup jendela ini.</p>
    <div class="msg ok" style="display:block">Repo: <a href="https://github.com/${esc(r.full_name)}" target="_blank">${esc(r.full_name)}</a></div>
    <div class="btns">
      <button id="runnow">▶ Jalankan sekarang</button>
      <button class="ghost" id="status">Cek status</button>
      <button class="ghost" id="openact">Buka GitHub</button>
    </div>
    <div class="msg" id="statmsg"></div>`;
  document.getElementById("openact").onclick = () => api().open_url(r.actions_url);
  document.getElementById("runnow").onclick = async () => {
    const box = document.getElementById("statmsg");
    box.className = "msg info"; box.innerHTML = "<span class='spinner'></span> Menjalankan…";
    const x = await api().run_now(ST.token, r.full_name, r.ref);
    box.className = "msg " + (x.ok ? "info" : "err");
    box.innerHTML = x.ok ? "Dijalankan. Buka GitHub untuk lihat hasilnya." : "❌ " + esc(x.error);
  };
  document.getElementById("status").onclick = async () => {
    const box = document.getElementById("statmsg");
    box.className = "msg info"; box.innerHTML = "<span class='spinner'></span> Mengecek…";
    const x = await api().run_status(ST.token, r.full_name);
    if (!x.ok) { box.className = "msg err"; box.innerHTML = "❌ " + esc(x.error); return; }
    const url = x.html_url ? ` — <a href="${esc(x.html_url)}" target="_blank">buka</a>` : "";
    box.className = "msg info";
    box.innerHTML = `Status terakhir: <b>${esc(x.status || "-")}</b> ${esc(x.conclusion || "")}${url}`;
  };
}

function addNav(nextStep, onBefore) {
  const wrap = document.createElement("div");
  wrap.className = "btns";
  if (ST.step > 0) {
    const back = document.createElement("button");
    back.className = "ghost"; back.textContent = "← Kembali";
    back.onclick = () => { ST.step--; render(); };
    wrap.appendChild(back);
  }
  if (nextStep >= 0) {
    const nx = document.createElement("button");
    nx.textContent = "Lanjut →";
    nx.onclick = async () => { if (onBefore) await onBefore(); ST.step = nextStep; render(); };
    wrap.appendChild(nx);
  }
  panel.appendChild(wrap);
}

function render() {
  renderSteps();
  if (ST.step === 0) stepGithub();
  else if (ST.step === 1) stepTikTok();
  else if (ST.step === 2) stepTelegram();
  else stepRun();
}

window.addEventListener("pywebviewready", async () => {
  connDot.style.background = "var(--accent)";
  try { const r = await api().load_token(); if (r && r.token) { ST.token = r.token; } } catch (e) {}
  // if a token was restored, fetch the login name for the header/step 0
  if (ST.token) { try { const me = await api().github_whoami(ST.token); if (me.ok) { ST.login = me.login; ST.owner = me.login; } } catch (e) {} }
  render();
});
setTimeout(() => { if (!panel.innerHTML) render(); }, 400);
</script>
</body>
</html>
